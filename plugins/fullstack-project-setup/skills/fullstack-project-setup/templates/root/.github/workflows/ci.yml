# See reference/architecture-decisions.md #8: this pipeline is ORDERED so
# `build` cannot run unless `test-frontend` and `test-backend` both passed
# their 80% coverage gate first. Coverage is never embedded inside the build
# commands themselves — the gate is enforced by job ordering (`needs:`).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest (apps/web, packages/*) + Jest (apps/native) — decision #10.
      # Coverage gate (80%) is configured in each project's
      # vitest.config.ts / jest config via `coverage.thresholds`.
      - run: pnpm test

  test-backend:
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          pip install uv
          uv sync
      - working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
        run: |
          uv run alembic upgrade head
          uv run pytest --cov --cov-fail-under=80
      - working-directory: backend
        run: uv run python scripts/check_file_length.py $(git ls-files '*.py')

  # Nothing below this line runs unless BOTH coverage gates above passed.
  build:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
