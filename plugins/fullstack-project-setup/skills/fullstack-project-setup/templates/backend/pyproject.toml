[project]
name = "{{PROJECT_SLUG}}-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pydantic-settings>=2.5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.2",
  "ruff>=0.6.5",
  "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.report]
# Repo-wide 80% gate — decision #8. CI enforces this with
# --cov-fail-under=80; kept here too so `pytest` alone shows the same number
# locally.
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E501 (line too long) is handled by the formatter; this project's real
# size limit is the 1000-line-per-FILE rule enforced by
# scripts/check_file_length.py, not a line-length rule.
select = ["E", "F", "I", "UP", "B"]
